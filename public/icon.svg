<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#2563eb"/>
  
  <!-- Balance Scale Symbol -->
  <!-- Left Pan -->
  <ellipse cx="150" cy="280" rx="60" ry="15" fill="#ffffff" opacity="0.9"/>
  <line x1="150" y1="280" x2="150" y2="200" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Right Pan -->
  <ellipse cx="362" cy="280" rx="60" ry="15" fill="#ffffff" opacity="0.9"/>
  <line x1="362" y1="280" x2="362" y2="200" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Center Beam -->
  <line x1="150" y1="200" x2="362" y2="200" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Center Support -->
  <line x1="256" y1="200" x2="256" y2="140" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Triangle top -->
  <path d="M 256 120 L 240 140 L 272 140 Z" fill="#ffffff"/>
  
  <!-- Base -->
  <rect x="200" y="380" width="112" height="12" rx="6" fill="#ffffff"/>
  <line x1="256" y1="320" x2="256" y2="380" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Rupee Symbol on Left Pan -->
  <text x="150" y="275" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle">₹</text>
  
  <!-- Rupee Symbol on Right Pan -->
  <text x="362" y="275" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle">₹</text>
</svg>
